<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        스마트 분리배출 시스템
    </title>

    <link rel="icon" href="./img/ChatGPT Image 2025년 11월 16일 오후 05_45_51.png" type="image/png">


  <!-- CSS 연결 -->
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/middle.css">
  <link rel="stylesheet" href="css/upload.css">
  <link rel="stylesheet" href="css/result.css">
  <link rel="stylesheet" href="css/footer.css">
</head>

<body>

  <!-- ======================== HEADER ======================== -->
<!-- <div>
  <img class="hansei" src="C:\Users\규혀니의 공부저장소\cloudproject\img\tit_system.png" alt="한세로고">
</div>  -->
 <header class="site-header">
    <div class="header-inner">
      <!-- 아이콘 영역 -->
      <div class="header-icon">
        <img src="./img/Image cycle.png" alt="에코 아이콘">
      </div>

      <!-- 텍스트 영역 -->
      <h1 class="header-title">스마트 분리배출</h1>
      <p class="header-desc">올바른 분리배출로 지구를 지키세요.<br>품목별 배출 방법을 쉽고 빠르게 찾아보세요.</p>
    </div>
  </header>

  <!-- ======================== CONTENT ======================== -->
  <main class="content">

<br>
<p>이미지 분석</p>

    <!-- 업로드 영역 -->
    <section class="upload-section">
      <div class="preview-area">
        <img id="previewImg" src="" alt="미리보기">
      </div>

      <div class="upload-box">
        <label for="fileInput" class="upload-btn">이미지 업로드</label>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      
    </section>
<br>
    <!-- 결과 영역 -->
    <section class="result-section">
      <div class="result-box">
        <h2>분석 결과</h2>
        <p id="trashType">쓰레기 종류: -</p>
        <p id="recycleType">재활용 여부: -</p>
      </div>

      <div id="loading" class="loading">AI 분석 중...</div>
    </section>

     <!-- 쓰레기 분리 배출 정보 -->
      <p>쓰레기 분리 배출 정보</p>
      <br>
        <div class="list">
            <div id="label1">♻️ 재활용 정의</div>
            <div id="label2">⚖️ 재활용 법률 조항</div>
            <div id="label3">💬 재활용 관련 커뮤니티</div>
            <div id="label4">📰 쓰레기 배출 관련 뉴스</div>
            <div id="label5">🎯 포인트 퀴즈</div>
        </div>


  </main>
<br>
  <!-- ======================== FOOTER ======================== -->
    <footer class="site-footer">
        <p>지구를 지키는 작은 실천, 분리배출! 🌍</p>
    </footer>


  <!-- JS -->
  <script src="js/aws-config.js"></script>
  <script src="js/indexjs.js"></script>
  <script src="js/middle.js"></script>


</body>
</html>
